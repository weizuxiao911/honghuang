# agent-image（agent-image）本地 K8s 开发部署
#
# 唯一事实源: ../设计文档.md 第四章「agent-image（agent-image）」
# 访问路径: gateway 通过 K8s API 动态创建 Pod（见 taichu-runtime namespace），不依赖静态 Deployment。
# PVC 在此 namespace 保留供 gateway 动态 Pod 挂载；ServiceAccount / RBAC 由 gateway 侧管理。
#
# 不注入 OPENCODE_CONFIG，避免 opencode schema 兼容性问题；业务配置由 gateway 在 Pod 创建时通过 OPENCODE_CONFIG_CONTENT 注入。

---
apiVersion: v1
kind: Namespace
metadata:
  name: taichu-agent-image
  labels:
    app: agent-image
    module: taichu
# 此 namespace 保留为 gateway 动态创建 agent-image DevMode Pod 的归属。
# 历史静态 Deployment/Service/Ingress 已下线，由 gateway 通过 K8s API 在此处按需创建。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-image-workspace
  namespace: taichu-agent-image
  labels:
    app: agent-image
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 5Gi
