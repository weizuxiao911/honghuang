---
# app 命名空间
apiVersion: v1
kind: Namespace
metadata:
  name: taichu-infra
  labels:
    app: app
    module: taichu
---
# app ConfigMap: 用户持久化 .env 所在 hostpath + gateway 等运行时配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: taichu-infra
  labels:
    app: app
    module: taichu
data:
  GATEWAY_URL: "http://gateway.taichu.localhost"
  RUNTIME_HOST_SUFFIX: "runtime.taichu.localhost"
  DEPLOY_ENV: "dev"
---
# app Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: taichu-infra
  labels:
    app: app
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: taichu
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.kubernetes.io/component: platform
    spec:
      containers:
        - name: app
          image: taichu/app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: ENV_FILE
              value: /etc/taichu/.env
          volumeMounts:
            - name: user-env
              mountPath: /etc/taichu
              readOnly: false
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1000m"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: user-env
          hostPath:
            path: /tmp/taichu-app
            type: DirectoryOrCreate
---
# app Service
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: taichu-infra
  labels:
    app: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: app
---
# app Ingress: app.taichu.localhost -> app Service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: taichu-infra
  labels:
    app.kubernetes.io/component: platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.taichu.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80